name: index-daily
# 매일 05:00 KST — invest-index 자동 지표(pubg·jmtba·palm_pals·카지노 3사) 수집·append → index.html 커밋
# (클락슨 신조선가·DRAM/NAND 스팟은 텔레그램 세션·수동 조회가 필요해 Mac에서 처리)
on:
  schedule:
    - cron: '0 20 * * *'   # 05:00 KST
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: index-daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -q requests pytrends
      - name: auto indicators
        env:
          TZ: Asia/Seoul
        run: python scripts/daily_update.py auto
      - name: commit
        run: |
          git config user.name 리송
          git config user.email whysosary@naver.com
          if git diff --quiet index.html; then echo "변경 없음 — 커밋 생략"; else
            git add index.html && git commit -q -m "일일 데이터 업데이트 $(TZ=Asia/Seoul date +%F) (auto)" && git push -q origin HEAD:main && echo "✅ pushed $(git rev-parse --short HEAD)"; fi
      - name: rebuild pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
