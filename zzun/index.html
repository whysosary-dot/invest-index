<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const T=THREE;

/* ================= scene ================= */
const canvas=$('c');
const renderer=new T.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.background=new T.Color(0xBFD8E8);
const camera=new T.PerspectiveCamera(50,1,0.1,400);
const hemi=new T.HemisphereLight(0xDDEEFF,0xE0C9A8,0.25);scene.add(hemi);
const sun=new T.DirectionalLight(0xFFF3E0,0.55);sun.position.set(6,12,4);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-9,right:9,top:9,bottom:-9,near:1,far:40});sun.shadow.bias=-0.002;sun.shadow.normalBias=0.08;
scene.add(sun);scene.add(sun.target);
const amb=new T.AmbientLight(0xffffff,0.12);scene.add(amb);

const grad=(()=>{const d=new Uint8Array([120,165,205]);const t=new T.DataTexture(d,3,1,T.LuminanceFormat);t.minFilter=t.magFilter=T.NearestFilter;t.needsUpdate=true;return t;})();
const mat=(c,o={})=>new T.MeshToonMaterial(Object.assign({color:c,gradientMap:grad},o));
function box(w,h,d,c,x=0,y=0,z=0,parent=scene,opts={}){const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat(c,opts));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
function sphere(r,c,x=0,y=0,z=0,parent=scene,seg=18){const m=new T.Mesh(new T.SphereGeometry(r,seg,seg),mat(c));m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m;}
function cyl(rt,rb,h,c,x=0,y=0,z=0,parent=scene){const m=new T.Mesh(new T.CylinderGeometry(rt,rb,h,20),mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}

/* ---- apartment: 네이버 평면도 기준 (한빛 주상복합 102동) 11m x 7m · 바닥은 사진처럼 흰 대리석 톤 ---- */
const FLOOR=0xF1E6D6, WALL=0xFBF7F0, TILE=0xCFE0EA, HEX=0xC9CDD4, BAL=0xD6D9DD;
const rooms=[
  {n:'방2 · 아기용품',x:-5.5,z:-3.5,w:2.5,d:2.5,c:0xEAE3D8},
  {n:'화장실1',x:-3.0,z:-3.5,w:1.6,d:2.5,c:TILE},
  {n:'화장실2',x:-1.4,z:-3.5,w:1.2,d:2.2,c:0xCFD8DF},
  {n:'방3 · 안방',x:-0.2,z:-3.5,w:4.5,d:2.7,c:0xE8E0D4},
  {n:'현관',x:-5.5,z:-1.0,w:1.5,d:1.3,c:HEX},
  {n:'방1 · 드레스룸',x:-5.5,z:0.3,w:2.9,d:3.2,c:0xEAE3D8},
  {n:'주방',x:-2.6,z:0.3,w:1.6,d:3.2,c:0xE9E4DB},
  {n:'거실',x:-4.0,z:-1.0,w:8.3,d:1.3,c:FLOOR,nolabel:true},
  {n:'거실',x:-1.0,z:0.3,w:5.3,d:3.2,c:FLOOR},
  {n:'발코니',x:4.3,z:-3.5,w:1.2,d:7,c:BAL},
];
rooms.forEach(r=>{const m=new T.Mesh(new T.PlaneGeometry(r.w,r.d),mat(r.c));m.rotation.x=-Math.PI/2;m.position.set(r.x+r.w/2,0,r.z+r.d/2);m.receiveShadow=true;scene.add(m);});
{const g=new T.Mesh(new T.PlaneGeometry(60,60),mat(0x9CC98A));g.rotation.x=-Math.PI/2;g.position.y=-0.02;g.receiveShadow=true;scene.add(g);}

const WH=1.05, WT=0.14, walls=[];
function wall(x1,z1,x2,z2,c=WALL){const w=Math.abs(x2-x1)||WT,d=Math.abs(z2-z1)||WT;const cx=(x1+x2)/2,cz=(z1+z2)/2;const h=(w>d)?WH-0.008:WH; // 가로벽은 살짝 낮게 → 교차부 윗면 겹침 없음
  box(w,h,d,c,cx,h/2,cz);walls.push({x:cx-w/2,z:cz-d/2,w,d});}
function glass(x1,z1,x2,z2){const w=Math.abs(x2-x1)||0.05,d=Math.abs(z2-z1)||0.05;const m=box(w,WH,d,0xBFE0F0,(x1+x2)/2,WH/2,(z1+z2)/2,scene,{transparent:true,opacity:0.35});m.castShadow=false;walls.push({x:(x1+x2)/2-w/2,z:(z1+z2)/2-d/2,w,d});}
function curtain(x,z,w,d,c){const m=box(w,WH-0.05,d,c,x,(WH-0.05)/2,z);m.castShadow=false;}
wall(-5.5,-3.5,5.5,-3.5);wall(-5.5,3.5,5.5,3.5);wall(5.5,-3.5,5.5,3.5);
wall(-5.5,-3.5,-5.5,-0.75);wall(-5.5,0.0,-5.5,3.5);
wall(4.3,-3.5,4.3,-2.9);glass(4.3,-2.9,4.3,-1.5);wall(4.3,-1.5,4.3,0.4);/* 거실 발코니 미닫이문: 유리 위쪽(북쪽) z 0.4~1.3 열림 */glass(4.3,1.3,4.3,3.0);wall(4.3,3.0,4.3,3.5);
wall(-5.5,-1.0,-4.0,-1.0);wall(-3.1,-1.0,-3.0,-1.0);wall(-3.0,-3.5,-3.0,-1.0);
wall(-3.0,-1.0,-2.65,-1.0);wall(-1.75,-1.0,-1.4,-1.0);wall(-1.4,-3.5,-1.4,-1.3);

function label(text,x,y,z,size=0.5,color='#3A332C'){const m=document.createElement('canvas').getContext('2d');m.font='48px Jua, "Noto Sans KR", sans-serif';const tw=m.measureText(text).width;
  const W=Math.max(256,Math.ceil((tw+60)/32)*32);const c=document.createElement('canvas');c.width=W;c.height=128;const g=c.getContext('2d');
  g.font='48px Jua, "Noto Sans KR", sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillStyle='rgba(255,252,246,.85)';
  const w=tw+40;g.beginPath();g.roundRect?g.roundRect(W/2-w/2,24,w,80,24):g.rect(W/2-w/2,24,w,80);g.fill();g.fillStyle=color;g.fillText(text,W/2,66);
  const tx=new T.CanvasTexture(c);const sp=new T.Sprite(new T.SpriteMaterial({map:tx,transparent:true,depthTest:false}));sp.scale.set(size*2*(W/256),size,1);sp.position.set(x,y,z);scene.add(sp);return sp;}

function towerTex(c1,c2){const c=document.createElement('canvas');c.width=64;c.height=128;const g=c.getContext('2d');g.fillStyle=c1;g.fillRect(0,0,64,128);g.fillStyle=c2;for(let y=8;y<128;y+=16)for(let x=6;x<64;x+=16)g.fillRect(x,y,8,7);const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;return t;}
const TT=towerTex('#F1ECE2','#B7D3E3'), TT2=towerTex('#E3DDD1','#A9C3D2');
function building(x,z,w,h,d,c,name,tall){let material;
  if(tall){const roof=mat(c===1?0xD9D4C9:0xC9C3B6);const mk=(len)=>{const t=(c===1?TT:TT2).clone();t.needsUpdate=true;t.repeat.set(Math.max(1,Math.round(len/3)),Math.max(1,Math.round(h/4)));return new T.MeshToonMaterial({map:t,gradientMap:grad});};
    const sx=mk(d),sz=mk(w);material=[sx,sx,roof,roof,sz,sz];} // +x,-x,+y(지붕),-y,+z,-z — 지붕엔 창문 없음
  else material=mat(c);
  const m=new T.Mesh(new T.BoxGeometry(w,h,d),material);
  m.position.set(OX+x,h/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);oSolid(x,z,w,d);

function signTex(text,bg,fg){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');g.fillStyle='#'+bg.toString(16).padStart(6,'0');g.fillRect(0,0,256,64);g.fillStyle='#'+fg.toString(16).padStart(6,'0');let fs=34;g.font=`bold ${fs}px "Noto Sans KR", sans-serif`;while(g.measureText(text).width>236&&fs>14){fs-=2;g.font=`bold ${fs}px "Noto Sans KR", sans-serif`;}g.textAlign='center';g.textBaseline='middle';g.fillText(text,128,34);const t=new T.CanvasTexture(c);return t;}

  const cost=a.st||0;if(cost>0&&S.stamina<cost){toast('체력이 없어요… 주방에서 커피 한 잔');return;}
  S.busy={a,total:a.min,left:a.min};beginAnim(a);$('prog').style.display='block';$('progT').textContent=a.t+' 중…';renderActs();
}
function finishAct(){const a=S.busy.a;endAnim();SFX.play('done');S.stamina=clamp(S.stamina-(a.st||0));a.run();S.busy=null;$('prog').style.display='none';renderActs();renderHUD();}
function pickUp(b){if(S.carrying)return;if(b.state==='stroller'){S.inStroller=S.inStroller.filter(x=>x!==b.id);}
  if(b.asleep>0){b.asleep=0;b.face='fuss';b.bored=clamp(b.bored+10);log(`${b.name} 깼어요`,'alert');}
  b.state='carried';S.carrying=b;P.hold.add(b.g);b.g.position.set(0,-0.2,0.0);b.g.rotation.set(0,0,0);b.g.scale.setScalar(0.75);setFace(b,'laugh');b.face='laugh';}
function putDown(where){const b=S.carrying;if(!b)return;if(where==='floor'&&S.outside){where='stroller';}S.carrying=null;b.g.scale.setScalar(1);
  if(where==='crib'){b.state='crib';scene.add(b.g);const slot=B.ju===b?-0.45:0.45;b.g.position.set(cribPos.x,0.12,cribPos.z+slot);b.g.rotation.set(-Math.PI/2+0.2,0,0);}
  else if(where==='stroller'){b.state='stroller';stroller.add(b.g);const slot=B.ju===b?-0.22:0.22;b.g.position.set(slot,0.55,0);b.g.rotation.set(0,0,0);b.g.scale.setScalar(0.8);S.inStroller.push(b.id);}
  else{scene.add(b.g);const f=new T.Vector3(Math.sin(P.yaw),0,Math.cos(P.yaw));const p=P.pos.clone().add(f.multiplyScalar(0.7));const surf=S.outside?null:SURFACES.find(sf=>p.x>sf.x-sf.w/2&&p.x<sf.x+sf.w/2&&p.z>sf.z-sf.d/2&&p.z<sf.z+sf.d/2);
    if(surf){placeBaby(b,p.x,p.z);b.g.position.y=surf.y;b.onSurface=surf;log(`${b.name}를 ${surf.n} 위에 앉혔어요`,'');}else{const q=p.clone();collideBaby(q);placeBaby(b,q.x,q.z);}b.g.rotation.y=P.yaw+Math.PI;}
}

/* ================= tick (game minute) ================= */
const RATE={hunger:0.9,sleepy:0.8,diaper:0.65,bored:0.8}; // 텀을 넉넉하게
let minAcc=0;
function gameMinute(){
  S.t++;
  if(S.out){S.out.left--;if(S.out.left<=0)endOuting();}
  Object.values(B).forEach(b=>{
    if(b.asleep>0){b.asleep--;b.sleepy=clamp(b.sleepy-0.45);b.hunger=clamp(b.hunger+0.12);b.diaper=clamp(b.diaper+0.06);
      if(b.asleep<=0){b.face='ok';log(`${b.name} 낮잠 끝, 개운!`,'good');}}
    else{
      const onToy=b.state==='floor'&&(b.g.position.distanceTo(gymPos)<0.9||b.g.position.distanceTo(matPos)<0.9);
      for(const k in RATE){let r=RATE[k]/5*(0.8+Math.random()*0.5);if(S.out&&k==='bored')r=0;if(S.out&&k==='sleepy')r*=1.4;if(k==='bored'&&(onToy||b.state==='carried'||(b.state==='stroller'&&S.outside)))r=-0.25;if(b.state==='stroller'&&S.outside&&k==='sleepy')r*=1.3;if(k==='bored'&&b.state==='crib')r*=2;b[k]=clamp(b[k]+r);}
      if(b.face==='laugh'&&Math.random()<.06)b.face='ok';
    }
    const m=moodOf(b);if(m.cls==='bad'){S.score-=0.6;S.cryCount++;}else if(m.cls==='warn')S.score+=0.1;else S.score+=0.4;
    if(!S.out&&Math.random()<.012){randomEvent(b);}
  });
  if(Object.values(B).every(b=>b.asleep>0)&&!S.busy)S.stamina=clamp(S.stamina+0.3);
  checkMissions();if(S.photoOp){S.photoOp.left--;if(S.photoOp.left<=0){S.photoOp=null;renderActs();}updatePhotoBtn();}
  if(S.busy){S.busy.left--;$('progB').style.width=(100*(1-S.busy.left/S.busy.total))+'%';if(S.busy.left<=0)finishAct();}
  if(S.t>=END)endDay();
}
function randomEvent(b){const r=Math.random();
  if(b.asleep>0){if(r<.35){b.asleep=0;b.face='cry';b.bored=clamp(b.bored+20);log(`${b.name} 낮잠 중 깼어요`,'alert');}return;}
  if(r<.3){b.diaper=clamp(b.diaper+30);log(`${b.name} 응가 폭탄 💩`,'alert');}
  else if(r<.55){b.face='laugh';S.score+=8;log(`${b.name} 뒤집기 성공! (+8)`,'good');photoOp(b,'뒤집기 성공');}
  else if(r<.75){b.bored=clamp(b.bored+15);b.sleepy=clamp(b.sleepy+10);log(`${b.name} 이앓이로 칭얼`,'alert');}
  else{const o=b===B.ju?B.se:B.ju;if(o.asleep===0&&b.g.position.distanceTo(o.g.position)<2.5){b.bored=clamp(b.bored-10);o.bored=clamp(o.bored-10);log('준우·준서 서로 보고 까르르','good');photoOp(b,'둘이 마주 보고 까르르');}}
}

function renderHUD(){
  $('clock').textContent=fmt(S.t);$('dayLabel').textContent=`DAY ${S.day} · 길동 한빛아파트 84㎡`;
  const st=$('stam');st.style.width=S.stamina+'%';st.className=S.stamina<25?'bad':S.stamina<50?'warn':'';$('stamN').textContent=Math.round(S.stamina);
  $('score').textContent=Math.round(S.score);
  Object.values(B).forEach(b=>{const m=moodOf(b);const me=$('m-'+b.id);me.textContent=m.txt;me.className='m '+m.cls;$('bc-'+b.id).classList.toggle('crying',m.cls==='bad');
    $('n-'+b.id).innerHTML=[['배고픔','hunger'],['졸림','sleepy'],['기저귀','diaper'],['심심함','bored']].map(([l,k])=>{const v=Math.round(b[k]);return `<div class="n"><span>${l}</span><div class="bar"><i class="${v>=80?'bad':v>=60?'warn':''}" style="width:${v}%"></i></div></div>`;}).join('');
    $('w-'+b.id).textContent=`${whereBaby(b)} · ${b.dressed?'외출복':'실내복'}${b.asleep>0?' · 잠 '+b.asleep+'분':''}`;
    setFace(b,m.face);setStatus(b,b.asleep>0?'💤':m.cls?worstNeed(b):'');});
}

/* ================= day end / intro ================= */
function endDay(){
  S.ended=true;if(S.mall){S.mall=false;S.outside=false;scene.add(stroller);}else if(S.outside)goInside();if(S.busy)endAnim();S.busy=null;$('prog').style.display='none';if(S.out)endOuting();
  const sc=Math.round(S.score);let best=0;try{best=+(localStorage.getItem('twins3d-best')||0);if(sc>best){best=sc;localStorage.setItem('twins3d-best',String(sc));}}catch(e){}
  const stars=sc>=420?5:sc>=320?4:sc>=220?3:sc>=120?2:1;
  const notes=Object.values(B).map(b=>`${b.name}: 이유식 ${b.fedSolid}번 · 분유 ${b.fedFormula}번 · ${moodOf(b).txt}`);
  notes.push(`${MODE==='mom'?'엄마':'아빠'} 체력 ${Math.round(S.stamina)} · 커피 ${S.coffee}잔`);notes.push(`미션 ${S.missions.filter(m=>m.done).length}/3 · 황금 딸랑이 ${S.rattlesGot}/6 · 추억 사진 ${S.photosToday}장 (앨범 ${ALBUM.length}장)`);
  $('sheet').innerHTML=`<h2>밤 9시, 오늘 하루 끝</h2><div class="stars">${'★'.repeat(stars)}<span style="opacity:.25">${'★'.repeat(5-stars)}</span></div>
    <p>행복점수 <b>${sc}</b> · 최고 ${best}</p><ul>${notes.map(n=>`<li>${n}</li>`).join('')}</ul>
    <p>${stars>=4?'둘 다 방긋방긋한 하루. 이 정도면 하남 한 번 더 가도 되겠는데요?':stars>=3?'무난한 하루. 낮잠 타이밍만 맞추면 별 하나 더!':'쌍둥이는 원래 이래요. 커피부터 한 잔 하고 내일 다시.'}</p>
    <button class="cta" id="againBtn">DAY ${S.day+1} 시작</button>`;
  $('overlay').style.display='grid';
  $('againBtn').addEventListener('click',()=>{const d=S.day+1;init(d);S.started=true;$('overlay').style.display='none';log(`DAY ${d} 아침 7시 기상`,'');renderActs();});
}
function intro(){
  $('sheet').innerHTML=`<h2>아기 쌍둥이 쭌쭌 돌보기</h2><p>길동 한빛아파트 84㎡, 8개월 쌍둥이의 하루 (07:00 → 21:00, 약 3분 30초)</p>
    <div class="help"><b>이동</b> — 방향키 / WASD, 모바일은 화면 왼쪽 드래그(조이스틱). 오른쪽 드래그로 시점 회전, 휠·핀치로 거리.<br>
    <b>돌보기</b> — 아기 옆에서 「안기」→ 안은 채로 주방(이유식·분유 바로 먹이기), 방2 아기용품방(기저귀 서랍장), 화장실1(아기 욕조), 방1 드레스룸(옷장), 방3 안방(침대 옆 아기 매트리스 재우기)으로 걸어가면 버튼이 떠요.<br>
    <b>놀이</b> — 아기체육관·물놀이매트 위에 내려놓으면 심심함이 저절로 줄어요. 안고 있어도 줄어요.<br>
    <b>외출</b> — 둘 다 배부르고·기저귀 깨끗하고·외출복 입혀서 현관 유모차에 태우면 하남스타필드로 출발! 현관에서 「동네 산책」을 누르면 밖으로 나가요 — 단지 앞 가게들부터 천호역·현대백화점·이마트·천호공원·강동구청·강동성심병원·길동생태공원·광나루한강공원·올림픽공원까지(약 3km를 1/10로 줄인 동네). 유모차에 아기를 태우고 나가면 공원 산책·유아휴게실·영유아 검진도 할 수 있어요.<br>
    <b>게임 요소</b> — 집 안에 숨은 황금 딸랑이 6개 ✨, 오늘의 미션 3개, 아기가 웃는 순간 📸 버튼을 누르면 추억 앨범에 저장(다음 날에도 남아요).<br>
    <b>목표</b> — 네 게이지를 60 아래로. 80을 넘으면 울고 점수가 깎여요. 둘 다 재우면 엄마아빠 체력 회복.</div>
    <p style="margin-top:12px"><b>누가 돌보나요? (누르면 바로 시작)</b></p><div class="modes"><button class="mode" data-m="mom">👩 엄마 모드<small>흰 티셔츠 · 단발 · 품에 안기</small></button><button class="mode" data-m="dad">👨 아빠 모드<small>초록 줄무늬 · 아기띠</small></button></div>
    <button class="cta" id="startBtn">아침 7시, 시작</button>`;
  $('overlay').style.display='grid';
  const setMode=m=>{MODE=m;try{localStorage.setItem('twins3d-mode',m);}catch(e){}document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('on',b.dataset.m===m));init(S.day);};
  document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{setMode(b.dataset.m);S.started=true;$('overlay').style.display='none';log('아침 7시, 준우·준서 기상 — 분유부터?','');renderActs();}));setMode(MODE);
  $('startBtn').addEventListener('click',()=>{S.started=true;$('overlay').style.display='none';log('아침 7시, 준우·준서 기상 — 분유부터?','');renderActs();});
}

/* ================= input ================= */
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();const b=$('acts').querySelector('button:not(:disabled)');if(b)b.click();}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
let joy={active:false,id:null,ox:0,oy:0,dx:0,dy:0};let drag={active:false,id:null,lx:0};let pinch=null;
const joyEl=$('joy'),joyK=$('joyK');
canvas.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch'||e.pointerType==='pen'){
    if(e.clientX<innerWidth*0.45&&!joy.active){joy={active:true,id:e.pointerId,ox:e.clientX,oy:e.clientY,dx:0,dy:0};joyEl.style.left=(e.clientX-60)+'px';joyEl.style.top=(e.clientY-60)+'px';joyEl.style.bottom='auto';joyEl.style.display='block';}
    else if(!drag.active){drag={active:true,id:e.pointerId,lx:e.clientX};}
  } else {drag={active:true,id:e.pointerId,lx:e.clientX};}
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(joy.active&&e.pointerId===joy.id){let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const l=Math.hypot(dx,dy);if(l>50){dx*=50/l;dy*=50/l;}joy.dx=dx/50;joy.dy=dy/50;joyK.style.transform=`translate(${dx}px,${dy}px)`;}
  else if(drag.active&&e.pointerId===drag.id){S.camYaw-=(e.clientX-drag.lx)*0.008;drag.lx=e.clientX;}
});
function up(e){if(joy.active&&e.pointerId===joy.id){joy.active=false;joy.dx=joy.dy=0;joyK.style.transform='';if(!matchMedia('(pointer:coarse)').matches)joyEl.style.display='none';else{joyEl.style.left='24px';joyEl.style.top='auto';joyEl.style.bottom='24px';}}
  if(drag.active&&e.pointerId===drag.id)drag.active=false;}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{S.camDist=clamp(S.camDist+e.deltaY*0.01,4,13);},{passive:true});
canvas.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:true});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);S.camDist=clamp(S.camDist-(d-pinch)*0.02,4,13);pinch=d;}},{passive:true});
$('sndBtn').addEventListener('click',()=>{SFX.setMute(!SFX.isMuted());toast(SFX.isMuted()?'효과음 끔':'효과음 켬');});if(SFX.isMuted())$('sndBtn').textContent='🔇';
$('photoBtn').addEventListener('click',e=>{e.stopPropagation();takePhoto();renderActs();renderHUD();});
$('missions').addEventListener('click',()=>{$('missions').classList.toggle('open');});
$('camBtn').addEventListener('click',()=>{S.camMode=(S.camMode+1)%3;toast(['따라가기','높이서 보기','평면도 시점'][S.camMode]);});

/* ================= collision ================= */
const R=0.27;
function collideBaby(p){const all=walls.concat(solids);for(const w of all){const cx=clamp(p.x,w.x,w.x+w.w),cz=clamp(p.z,w.z,w.z+w.d);let dx=p.x-cx,dz=p.z-cz;const d=Math.hypot(dx,dz);if(d<0.3){if(d<1e-4){dx=1;dz=0;}else{dx/=d;dz/=d;}p.x=cx+dx*0.3;p.z=cz+dz*0.3;}}}
function collide(p){const all=S.mall?mallWalls:(S.outside?outWalls:walls.concat(solids));
  if(B)Object.values(B).forEach(b=>{if(b.state!=='floor')return;const dx=p.x-b.g.position.x,dz=p.z-b.g.position.z;const d=Math.hypot(dx,dz),min=R+0.3;if(d<min&&d>1e-4){p.x=b.g.position.x+dx/d*min;p.z=b.g.position.z+dz/d*min;}});for(const w of all){const cx=clamp(p.x,w.x,w.x+w.w),cz=clamp(p.z,w.z,w.z+w.d);let dx=p.x-cx,dz=p.z-cz;const d=Math.hypot(dx,dz);
  if(d<R){if(d<1e-4){dx=1;dz=0;}else{dx/=d;dz/=d;}p.x=cx+dx*R;p.z=cz+dz*R;}}
  if(S.mall){p.x=clamp(p.x,SX-117,SX+117);p.z=clamp(p.z,-19,53);}else if(S.outside){p.x=clamp(p.x,OX-227,OX+295);p.z=clamp(p.z,-155,220);}else{p.x=clamp(p.x,-5.25,5.25);p.z=clamp(p.z,-3.25,3.25);}}

/* ================= loop ================= */
let last=performance.now(),walkT=0,lastActKey='';
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  resize();
  if(S.started&&!S.ended){
    // time
    minAcc+=dt*MIN_PER_SEC*(S.out?6:1);let changed=false;while(minAcc>=1){minAcc--;gameMinute();changed=true;}
    if(changed)renderHUD();
    // movement
    if(!S.busy&&!S.out){
      let ix=0,iz=0;if(keys.arrowup||keys.w)iz-=1;if(keys.arrowdown||keys.s)iz+=1;if(keys.arrowleft||keys.a)ix-=1;if(keys.arrowright||keys.d)ix+=1;
      if(joy.active){ix+=joy.dx;iz+=joy.dy;}
      const l=Math.hypot(ix,iz);if(l>1){ix/=l;iz/=l;}
      if(l>0.05){const cy=S.camYaw;const wx=ix*Math.cos(cy)+iz*Math.sin(cy),wz=-ix*Math.sin(cy)+iz*Math.cos(cy);
        const sp=(S.mall?4.5:S.outside?6.5:(S.carrying?2.2:3.0))*Math.min(1,l);P.pos.x+=wx*sp*dt;P.pos.z+=wz*sp*dt;collide(P.pos);
        const ty=Math.atan2(wx,wz);let d=ty-P.yaw;d=Math.atan2(Math.sin(d),Math.cos(d));P.yaw+=d*Math.min(1,dt*12);P.speed=sp;
        const w0=walkT;walkT+=dt*9*Math.min(1,l);if(!S.outside&&Math.floor(w0/Math.PI)!==Math.floor(walkT/Math.PI))SFX.play('step');}
      else P.speed=0;
    } else P.speed=0;
    P.g.rotation.y=P.yaw;
    const sw=P.speed>0?Math.sin(walkT)*0.5:0;P.legL.rotation.x=sw;P.legR.rotation.x=-sw;
    if(S.carrying){P.armL.rotation.x=P.armR.rotation.x=-1.3;P.armL.rotation.z=0.6;P.armR.rotation.z=-0.6;}else{P.armL.rotation.x=-sw*0.8;P.armR.rotation.x=sw*0.8;P.armL.rotation.z=0.12;P.armR.rotation.z=-0.12;}
    if(S.busy){animBusy(dt);P.g.rotation.y=P.yaw;}
    updateRattles(dt);if(S.outside){updateTraffic(dt);}
    if(S.__out!==!!S.outside){S.__out=!!S.outside;document.querySelector('.babies').hidden=S.__out;$('missions').hidden=S.__out;$('minimap').hidden=!S.__out;}
    if(S.outside)drawMinimap();
    
    // babies idle wiggle
    Object.values(B).forEach(b=>{b.wiggle+=dt;const m=moodOf(b);if(m.cls==='bad'&&b.lastCls!=='bad'&&(performance.now()-(b.cryAt||0))>15000){b.cryAt=performance.now();SFX.play('cry');}b.lastCls=m.cls;
      const posing=S.photoOp&&S.photoOp.b===b&&!b.parked;
      if(posing){setFace(b,'laugh');const w=b.wiggle;if(b.state==='floor'){const ty=Math.atan2(P.pos.x-b.g.position.x,P.pos.z-b.g.position.z);let d=ty-b.g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));b.g.rotation.y+=d*Math.min(1,dt*5);}
        if(S.photoOp.caption.includes('뒤집기')&&b.state==='floor'&&!b.onSurface){b.g.rotation.x=Math.min(0.4,(b.g.rotation.x||0)+dt*4);b.g.position.y=0.06;b.parts.armL.rotation.x=-1.5;b.parts.armR.rotation.x=-1.5;b.parts.armL.rotation.z=0.3;b.parts.armR.rotation.z=-0.3;b.parts.legL.rotation.x=0.2+Math.sin(w*4)*0.15;b.parts.legR.rotation.x=0.2-Math.sin(w*4)*0.15;b.g.rotation.z=Math.sin(w*3)*0.04;} // 배 대고 고개 들기
        else{if(b.state==='floor'){b.g.rotation.x=Math.max(0,(b.g.rotation.x||0)-dt*4);b.g.position.y=b.onSurface?b.onSurface.y:0;}b.parts.armL.rotation.x=-0.3;b.parts.armR.rotation.x=-0.3;b.parts.armL.rotation.z=1.5+Math.sin(w*5)*0.2;b.parts.armR.rotation.z=-1.5-Math.sin(w*5)*0.2;b.g.rotation.z=Math.sin(w*5)*0.06;} // 만세 방긋
        b.sp.sprite.position.y=1.15+Math.sin(b.wiggle*4)*0.05;return;}
      if(b.state==='floor'&&!b.onSurface&&b.asleep<=0&&!S.out&&!b.parked){ // 기어다니기
        b.cr=b.cr||{t:1+Math.random()*3,dir:b.g.rotation.y,mv:false};const cr=b.cr;cr.t-=dt;
        if(cr.t<=0){cr.mv=!cr.mv&&Math.random()<0.65;cr.t=cr.mv?1.5+Math.random()*3:2+Math.random()*5;if(cr.mv)cr.dir=Math.random()*Math.PI*2;}
        if(cr.mv){const sp=0.2;const q=b.g.position.clone();q.x=clamp(q.x+Math.sin(cr.dir)*sp*dt,-5.1,5.1);q.z=clamp(q.z+Math.cos(cr.dir)*sp*dt,-3.1,3.1);collideBaby(q);
          const moved=Math.hypot(q.x-b.g.position.x,q.z-b.g.position.z);if(moved<sp*dt*0.5){cr.dir+=Math.PI*(0.6+Math.random()*0.8);}b.g.position.x=q.x;b.g.position.z=q.z;
          let d=cr.dir-b.g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));b.g.rotation.y+=d*Math.min(1,dt*6);
          b.g.rotation.x=Math.min(0.9,(b.g.rotation.x||0)+dt*3);b.g.position.y=0.12;const w=b.wiggle*9;b.parts.armL.rotation.x=-1.2+Math.sin(w)*0.5;b.parts.armR.rotation.x=-1.2-Math.sin(w)*0.5;b.parts.legL.rotation.x=0.8-Math.sin(w)*0.4;b.parts.legR.rotation.x=0.8+Math.sin(w)*0.4;b.g.rotation.z=Math.sin(w)*0.05;}
        else{b.g.rotation.x=Math.max(0,(b.g.rotation.x||0)-dt*3);b.g.position.y=0.12*(b.g.rotation.x/0.9);b.parts.legL.rotation.x*=0.9;b.parts.legR.rotation.x*=0.9;b.parts.armL.rotation.x*=0.9;b.parts.armR.rotation.x*=0.9;b.g.rotation.z=Math.sin(b.wiggle*2)*0.06;if(m.cls==='bad'){b.g.rotation.z=Math.sin(b.wiggle*18)*0.12;}b.parts.armL.rotation.z=0.5+Math.sin(b.wiggle*3)*0.25;b.parts.armR.rotation.z=-0.5-Math.cos(b.wiggle*3)*0.25;}}
      else if(b.state==='floor'){b.g.rotation.x=0;b.g.position.y=b.onSurface?b.onSurface.y:0;b.g.rotation.z=Math.sin(b.wiggle*2)*0.06;if(m.cls==='bad'){b.g.rotation.z=Math.sin(b.wiggle*18)*0.12;}b.parts.armL.rotation.z=0.5+Math.sin(b.wiggle*3)*0.25;b.parts.armR.rotation.z=-0.5-Math.cos(b.wiggle*3)*0.25;}
      else if(b.state==='carried'&&!b.parked&&!S.busy){b.g.rotation.z=Math.sin(b.wiggle*3)*0.05;b.parts.armL.rotation.z+=(0.5-b.parts.armL.rotation.z)*0.2;b.parts.armR.rotation.z+=(-0.5-b.parts.armR.rotation.z)*0.2;b.parts.armL.rotation.x*=0.8;b.parts.armR.rotation.x*=0.8;}
      b.sp.sprite.position.y=1.15+Math.sin(b.wiggle*4)*0.05;});
    // contextual actions refresh (cheap key)
    const k=[S.photoOp?1:0,S.carrying&&S.carrying.id,nearBaby()&&nearBaby().id,Object.keys(ST).filter(near).join(),S.busy?1:0,S.out?1:0,S.solid,S.formula,S.inStroller.length].join('|');
    if(k!==lastActKey){lastActKey=k;renderActs();}
    sun.position.set(P.pos.x+6,12,P.pos.z+4);sun.target.position.copy(P.pos);
    // lighting by hour
    const h=S.t/60;const dusk=clamp((h-17)/4,0,1);sun.intensity=0.55-dusk*0.3;sun.color.setHSL(0.09-dusk*0.03,0.6,0.9-dusk*0.25);hemi.intensity=0.25-dusk*0.1;amb.intensity=0.12+dusk*0.12;
    scene.background.setHSL(0.57-dusk*0.5,0.45,0.83-dusk*0.4);
  }
  // camera
  const tgt=P?P.pos:new T.Vector3();
  let cp;if(S.camMode===2){if(S.outside){cp=new T.Vector3(tgt.x,S.mall?45:70,tgt.z+(S.mall?12:20));camera.position.lerp(cp,0.08);camera.lookAt(tgt.x,0,tgt.z);}else{cp=new T.Vector3(tgt.x*0.3,13,tgt.z*0.3+4);camera.position.lerp(cp,0.08);camera.lookAt(0,0,0);}}
  else{let pitch=S.camMode===1?1.05:0.72;let d=S.camMode===1?S.camDist*1.3:S.camDist;if(S.mall){pitch=Math.max(pitch,0.85);d*=1.7;}else if(S.outside){pitch=Math.max(pitch,1.0);d*=1.8;}
    cp=new T.Vector3(tgt.x+Math.sin(S.camYaw)*Math.cos(pitch)*d,Math.sin(pitch)*d+0.6,tgt.z+Math.cos(S.camYaw)*Math.cos(pitch)*d);
    camera.position.lerp(cp,0.1);camera.lookAt(tgt.x,0.8,tgt.z);}
  renderer.render(scene,camera);
}
function resize(){const w=innerWidth,h=innerHeight;if(canvas.width!==Math.floor(w*renderer.getPixelRatio())||canvas.height!==Math.floor(h*renderer.getPixelRatio())){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}}

init(1);intro();requestAnimationFrame(frame);
})();
</script>
